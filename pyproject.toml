[project]
name = "kasm-use"
version = "0.2.0"
description = "Let AI agents drive Kasm Workspaces desktops (look, click, type) over MCP — works with stock Kasm images"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rchurro" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.9,<2"]
keywords = ["mcp", "kasm", "kasm-workspaces", "computer-use", "ai-agent", "hermes"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://github.com/rchurro/kasm-use"
Issues = "https://github.com/rchurro/kasm-use/issues"

[project.scripts]
kasm-use = "kasm_use.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kasm_use"]
